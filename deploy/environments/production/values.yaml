# Production overrides — domain/TLS via values; no hard-coded secrets in app source.
global:
  imagePullPolicy: IfNotPresent
  postgresql:
    host: '192.168.3.50' # override from POSTGRES_HOST when needed
    port: 5432
    sslMode: prefer

nodeSelector:
  nexatech.io/role: app

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/part-of: nexatech

# Docs portals may stay enabled; operators can flip to false for locked-down prod.
apps:
  swagger:
    enabled: true
  securityGuide:
    enabled: true

platform:
  redis:
    enabled: true
    persistence:
      storageClass: local-path
  rabbitmq:
    enabled: true
    persistence:
      storageClass: local-path
  minio:
    enabled: true
    persistence:
      storageClass: local-path

config:
  nodeEnv: production
  deployProfile: production
  publicStorefrontUrl: 'http://192.168.4.204'
  publicAdminUrl: 'http://192.168.4.204:3100'
  publicApiUrl: 'http://192.168.4.204'
  otel:
    enabled: false
    exporterEndpoint: ''
    protocol: http/protobuf

entry:
  enabled: true
  loadBalancerIP: '192.168.4.204'
  serviceType: LoadBalancer
  annotations:
    metallb.universe.tf/allow-shared-ip: nexatech-entry
  exposeApiPorts: true

migrations:
  enabled: true

# Ingress-only when enabled — egress to external PostgreSQL remains open.
networkPolicy:
  enabled: true

# SMTP: set via Secret; missing SMTP_HOST => email channel degraded (not fake success)
smtp:
  optional: true

seed:
  requiredOnly: true
