# Staging overrides — LAN/IP first. Domain/TLS later via values only.
# Prefer values-ghcr.yaml for the complete one-command GHCR lab install.
global:
  imageTag: '0.17.0'
  imagePullPolicy: IfNotPresent
  postgresql:
    host: '192.168.3.50'
    port: 5432
    sslMode: prefer

# Application workloads stay off Kong node (when nodes are labeled).
nodeSelector:
  nexatech.io/role: app

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/part-of: nexatech

apps:
  swagger:
    enabled: true
  securityGuide:
    enabled: true

platform:
  redis:
    persistence:
      storageClass: local-path
  rabbitmq:
    persistence:
      storageClass: local-path
  minio:
    persistence:
      storageClass: local-path

config:
  nodeEnv: production
  deployProfile: staging
  publicStorefrontUrl: 'http://192.168.4.204'
  publicAdminUrl: 'http://192.168.4.204:3100'
  publicApiUrl: 'http://192.168.4.204'
  otel:
    enabled: false
    exporterEndpoint: ''
    protocol: http/protobuf

entry:
  enabled: true
  loadBalancerIP: '192.168.4.204'
  serviceType: LoadBalancer
  annotations:
    metallb.universe.tf/allow-shared-ip: nexatech-entry
  exposeApiPorts: true

migrations:
  enabled: true

networkPolicy:
  enabled: true

# SMTP optional in staging — Mailpit (compose) is primary for email verification
smtp:
  optional: true

seed:
  requiredOnly: true
  # No products / orders / stock
