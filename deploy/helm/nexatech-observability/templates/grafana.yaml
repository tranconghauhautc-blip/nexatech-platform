{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexatech-observability.fullname" . }}-grafana-datasources
  labels:
    {{- include "nexatech-observability.componentLabels" (list . "grafana") | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: {{ include "nexatech-observability.prometheusUrl" . }}
        isDefault: true
        editable: false
      {{- if .Values.loki.enabled }}
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: {{ include "nexatech-observability.lokiUrl" . }}
        editable: false
      {{- end }}
      {{- if .Values.tempo.enabled }}
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: {{ include "nexatech-observability.tempoUrl" . }}
        editable: false
        jsonData:
          tracesToLogsV2:
            enabled: true
            datasourceUid: loki
          serviceMap:
            datasourceUid: prometheus
      {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexatech-observability.fullname" . }}-grafana-dashboards
  labels:
    {{- include "nexatech-observability.componentLabels" (list . "grafana") | nindent 4 }}
    grafana_dashboard: "1"
data:
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: nexatech
        orgId: 1
        folder: NexaTech
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
  http-health.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "pluginVersion": "11.2.2",
          "targets": [
            {
              "expr": "up{job=\"kubernetes-pods\"}",
              "legendFormat": "{{`{{kubernetes_pod_name}}`}}",
              "refId": "A"
            }
          ],
          "title": "Pod scrape up (HTTP health / metrics)",
          "type": "stat"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["nexatech", "health"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "NexaTech HTTP Health",
      "uid": "nexatech-http-health",
      "version": 1
    }
---
{{- if .Values.grafana.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nexatech-observability.fullname" . }}-grafana
  labels:
    {{- include "nexatech-observability.componentLabels" (list . "grafana") | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.grafana.persistence.size }}
  {{- $sc := include "nexatech-observability.storageClass" (dict "storageClass" .Values.grafana.persistence.storageClass "Values" .Values) }}
  {{- if $sc }}
  storageClassName: {{ $sc }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexatech-observability.fullname" . }}-grafana
  labels:
    {{- include "nexatech-observability.componentLabels" (list . "grafana") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nexatech-observability.selectorLabels" (list . "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexatech-observability.selectorLabels" (list . "grafana") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: {{ .Values.podSecurityContext.runAsNonRoot }}
        runAsUser: {{ .Values.grafana.securityContext.runAsUser }}
        runAsGroup: {{ .Values.grafana.securityContext.runAsGroup }}
        fsGroup: {{ .Values.grafana.securityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: grafana
          image: {{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafanaAdmin.existingSecret }}
                  key: {{ .Values.grafanaAdmin.userKey }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafanaAdmin.existingSecret }}
                  key: {{ .Values.grafanaAdmin.passwordKey }}
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            - name: GF_SERVER_HTTP_PORT
              value: {{ .Values.grafana.service.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.grafana.service.port }}
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
            runAsUser: {{ .Values.grafana.securityContext.runAsUser }}
            runAsNonRoot: true
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: {{ include "nexatech-observability.fullname" . }}-grafana-datasources
        - name: dashboards-config
          configMap:
            name: {{ include "nexatech-observability.fullname" . }}-grafana-dashboards
            items:
              - key: dashboard-provider.yaml
                path: dashboard-provider.yaml
        - name: dashboards
          configMap:
            name: {{ include "nexatech-observability.fullname" . }}-grafana-dashboards
            items:
              - key: http-health.json
                path: http-health.json
        - name: data
          {{- if .Values.grafana.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nexatech-observability.fullname" . }}-grafana
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexatech-observability.fullname" . }}-grafana
  labels:
    {{- include "nexatech-observability.componentLabels" (list . "grafana") | nindent 4 }}
spec:
  type: {{ .Values.grafana.service.type }}
  ports:
    - name: http
      port: {{ .Values.grafana.service.port }}
      targetPort: http
  selector:
    {{- include "nexatech-observability.selectorLabels" (list . "grafana") | nindent 4 }}
{{- end }}
