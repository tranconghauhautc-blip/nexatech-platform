# Default values — low resource footprint for small 3-node clusters.
# All Services are ClusterIP only (no public LoadBalancer dashboards).
nameOverride: ''
fullnameOverride: ''

global:
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  storageClass: ''

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
affinity: {}
tolerations: []

# Grafana admin credentials — create Secret before install (never commit real values):
#   kubectl create secret generic nexatech-observability-grafana \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password='CHANGE_ME'
grafanaAdmin:
  existingSecret: nexatech-observability-grafana
  userKey: admin-user
  passwordKey: admin-password

prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v2.54.1
  service:
    type: ClusterIP
    port: 9090
  retention: 7d
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ''
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: 11.2.2
  service:
    type: ClusterIP
    port: 3000
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ''
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472

loki:
  enabled: true
  image:
    repository: grafana/loki
    tag: 3.1.1
  service:
    type: ClusterIP
    port: 3100
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ''
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

promtail:
  enabled: true
  image:
    repository: grafana/promtail
    tag: 3.1.1
  # Mount node log directories for file-based scraping (no hostPath in chart defaults).
  # Example for production — add via --set-file or values overlay (not committed):
  # extraVolumes:
  #   - name: pods
  #     hostPath:
  #       path: /var/log/pods
  #       type: Directory
  # extraVolumeMounts:
  #   - name: pods
  #     mountPath: /var/log/pods
  #     readOnly: true
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  # Promtail requires root to read /var/log/pods on most clusters.
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0

tempo:
  enabled: true
  image:
    repository: grafana/tempo
    tag: 2.6.1
  service:
    type: ClusterIP
    port: 3200
    otlpGrpcPort: 4317
    otlpHttpPort: 4318
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ''
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

otelCollector:
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.111.0
  service:
    type: ClusterIP
    otlpGrpcPort: 4317
    otlpHttpPort: 4318
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 256Mi
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
