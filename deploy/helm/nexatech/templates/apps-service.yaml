{{- range $key, $app := .Values.apps }}
{{- if $app.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $app.name }}
  labels:
    {{- include "nexatech.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $app.name }}
    app.kubernetes.io/name: {{ $app.name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $app.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: {{ $app.name }}
{{- end }}
{{- end }}
