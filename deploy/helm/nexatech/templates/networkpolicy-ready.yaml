{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nexatech.fullname" . }}-default-deny-ingress
  labels:
    {{- include "nexatech.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  # When enabled: deny all ingress by default. Add allow policies per component.
  # Off by default for small clusters (networkPolicy.enabled: false).
{{- end }}
