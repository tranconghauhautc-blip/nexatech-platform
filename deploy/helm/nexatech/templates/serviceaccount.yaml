{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nexatech.serviceAccountName" . }}
  labels:
    {{- include "nexatech.labels" . | nindent 4 }}
  annotations:
    # Must exist BEFORE migration pre-install hooks (weight -5).
    # Persist after hooks so Deployments can use the same SA.
    # Delete policy is before-hook-creation only (resource kept after hook phase).
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: true
{{- end }}
