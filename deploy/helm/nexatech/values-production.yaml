# Production / staging-cluster overlay — real LAN topology.
# Secrets: operator-created Secret only — never commit real passwords.
#
# One-command (with GHCR registry overlay when needed):
#   helm upgrade --install nexatech deploy/helm/nexatech \
#     -n nexatech \
#     -f deploy/helm/nexatech/values-production.yaml
#
# Or GHCR lab:
#   helm upgrade --install nexatech deploy/helm/nexatech \
#     -n nexatech \
#     -f deploy/environments/staging/values-ghcr.yaml

global:
  imageRegistry: ghcr.io
  imageRepository: tranconghauhautc-blip/nexatech
  imageTag: '0.17.0'
  imagePullPolicy: IfNotPresent
  # Public GHCR: []. Private: [{ name: ghcr-pull }]
  imagePullSecrets: []
  postgresql:
    # External PostgreSQL
    host: '192.168.3.50'
    port: 5432
    sslMode: prefer
    poolMax: '20'
    connectTimeout: '10'
  secretsName: nexatech-secrets

apps:
  storefront:
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  admin:
    replicaCount: 1
  identity:
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  catalog:
    replicaCount: 2
  cart:
    replicaCount: 2
  order:
    replicaCount: 2
  swagger:
    enabled: true
  securityGuide:
    enabled: true

platform:
  redis:
    persistence:
      storageClass: local-path
  rabbitmq:
    persistence:
      storageClass: local-path
  minio:
    persistence:
      storageClass: local-path

entry:
  enabled: true
  loadBalancerIP: '192.168.4.204'
  serviceType: LoadBalancer
  annotations:
    metallb.universe.tf/allow-shared-ip: nexatech-entry
  exposeApiPorts: true

observability:
  enabled: false
  prometheusScrape:
    enabled: true
    path: /health/live

# Ingress-only — egress to 192.168.3.50:5432 remains allowed.
networkPolicy:
  enabled: true

config:
  logLevel: info
  nodeEnv: production
  deployProfile: production
  securityLab:
    enabled: false
  publicStorefrontUrl: 'http://192.168.4.204'
  publicAdminUrl: 'http://192.168.4.204:3100'
  publicApiUrl: 'http://192.168.4.204'
  otel:
    # Enable only after deploy/helm/nexatech-observability is installed.
    enabled: false
    exporterEndpoint: 'http://nexatech-obs-otel-collector:4318'
    protocol: 'http/protobuf'

migrations:
  enabled: true
