migrations:
  enabled: true
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

platform:
  redis:
    enabled: true
    image: redis:7.4.2-alpine
    port: 6379
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ''
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  rabbitmq:
    enabled: true
    image: rabbitmq:3.13.7-management-alpine
    amqpPort: 5672
    managementPort: 15672
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ''
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  minio:
    enabled: true
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    apiPort: 9000
    consolePort: 9001
    bucket: nexatech-media
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ''
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    bucketInit:
      enabled: true
      image: minio/mc:RELEASE.2025-01-17T23-25-50Z

entry:
  enabled: true
  # MetalLB VIP — Kong VM (192.168.4.209) calls this address only.
  loadBalancerIP: ''
  annotations: {}
  # Expose storefront :80, admin :3100, API ports for Kong upstreams.
  exposeApiPorts: true
  serviceType: LoadBalancer

networkPolicy:
  enabled: false

config:
  logLevel: info
  nodeEnv: production
  publicStorefrontUrl: ''
  publicAdminUrl: ''
  publicApiUrl: ''
