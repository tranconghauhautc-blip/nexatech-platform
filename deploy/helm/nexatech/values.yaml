# Default values — small cluster friendly. Override with values-production.yaml.
nameOverride: ''
fullnameOverride: ''

global:
  imageRegistry: ''
  imageRepository: nexatech
  imageTag: '0.17.0'
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # External PostgreSQL (production). Passwords via Secret only.
  postgresql:
    host: ''
    port: 5432
    sslMode: prefer
    poolMax: '10'
    connectTimeout: '10'
  redisUrlSecretKey: redis-url
  rabbitmqUrlSecretKey: rabbitmq-url
  secretsName: nexatech-secrets

serviceAccount:
  create: true
  name: ''
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

terminationGracePeriodSeconds: 30

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []

apps:
  storefront:
    enabled: true
    name: storefront-web
    replicaCount: 1
    image:
      name: storefront-web
      tag: ''
    port: 3000
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
