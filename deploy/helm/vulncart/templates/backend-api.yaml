apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vulncart.fullname" . }}-backend-api
  labels:
    {{- include "vulncart.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-api
spec:
  replicas: {{ .Values.backendApi.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend-api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend-api
        {{- include "vulncart.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend-api
          image: "{{ .Values.images.backendApi.repository }}:{{ .Values.images.backendApi.tag }}"
          imagePullPolicy: {{ .Values.images.backendApi.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backendApi.port }}
          env:
            - name: PORT
              value: {{ .Values.backendApi.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulncart.fullname" . }}-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulncart.fullname" . }}-secret
                  key: JWT_SECRET
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulncart.fullname" . }}-secret
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulncart.fullname" . }}-secret
                  key: ADMIN_PASSWORD
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backendApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vulncart.fullname" . }}-backend-api
  labels:
    {{- include "vulncart.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-api
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend-api
  ports:
    - name: http
      port: 80
      targetPort: http
