{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vulncart.fullname" . }}
  labels:
    {{- include "vulncart.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if and .Values.ingress.host .Values.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          # Longest prefixes first — keep /api intact for backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "vulncart.fullname" . }}-backend-api
                port:
                  number: 80
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: {{ include "vulncart.fullname" . }}-admin-web
                port:
                  number: 80
          - path: /security-guide
            pathType: Prefix
            backend:
              service:
                name: {{ include "vulncart.fullname" . }}-security-guide
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vulncart.fullname" . }}-storefront-web
                port:
                  number: 80
{{- end }}
