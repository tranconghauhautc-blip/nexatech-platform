{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vulncart.fullname" . }}-secret
  labels:
    {{- include "vulncart.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secret.postgresPassword is required" .Values.secret.postgresPassword | quote }}
  DATABASE_URL: {{ include "vulncart.databaseUrl" . | quote }}
  JWT_SECRET: {{ required "secret.jwtSecret is required" .Values.secret.jwtSecret | quote }}
  ADMIN_USERNAME: {{ .Values.secret.adminUsername | default "admin" | quote }}
  ADMIN_PASSWORD: {{ required "secret.adminPassword is required" .Values.secret.adminPassword | quote }}
{{- end }}
