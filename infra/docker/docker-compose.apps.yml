# App stack (M16) — build images from repo root; depends on infra from docker-compose.dev.yml
#
# QUAN TRỌNG: các backend Nest ở file này dùng `depends_on` với healthcheck của
# postgres/redis/rabbitmq (định nghĩa trong docker-compose.dev.yml). `depends_on`
# CHỈ hoạt động khi Compose thấy cả hai service trong CÙNG một lần invoke — vì vậy
# PHẢI chạy gộp (-f) cả hai file trong một lệnh duy nhất:
#
#   docker compose -f infra/docker/docker-compose.dev.yml -f infra/docker/docker-compose.apps.yml up -d --build
#
# Nếu chỉ chạy riêng file này (ví dụ CI chỉ build image), Compose sẽ báo lỗi
# "service not found" cho postgres/redis/rabbitmq/minio — đó là lý do bắt buộc
# phải dùng lệnh gộp ở trên cho local dev đầy đủ. Chạy riêng
# `docker compose -f infra/docker/docker-compose.dev.yml up -d` trước rồi mới
# `docker compose -f infra/docker/docker-compose.apps.yml up -d --build` (không
# gộp -f) sẽ KHÔNG áp depends_on được vì đây là 2 lần invoke Compose khác nhau
# trên network `nexatech-dev` external — container vẫn kết nối được qua network
# nhưng Compose sẽ không tự chờ healthy trước khi start app. Ưu tiên luôn dùng
# lệnh gộp ở trên.
#
# Image tags use semver (không dùng latest).

x-backend-env: &backend-env
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-min-32-chars}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-32-chars}
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  NODE_ENV: production

# Chờ postgres/redis/rabbitmq healthy trước khi start backend Nest (chỉ có hiệu
# lực khi chạy gộp -f với docker-compose.dev.yml — xem chú thích Usage ở trên).
x-depends-infra: &depends-infra
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

# Restart chính sách chung cho backend Nest: tự khởi động lại tối đa 5 lần khi
# lỗi (ví dụ chưa kết nối được DB ngay khi container khác chưa sẵn sàng).
x-backend-restart: &backend-restart on-failure:5

services:
  kong:
    image: kong:3.9.0
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: '0.0.0.0:8000'
      KONG_ADMIN_LISTEN: '0.0.0.0:8001'
      KONG_LOG_LEVEL: notice
    ports:
      - '8000:8000'
      - '8001:8001'
    volumes:
      - ../kong/kong.yml:/kong/kong.yml:ro
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 10

  identity-service:
    build:
      context: ../..
      dockerfile: apps/identity-service/Dockerfile
    image: nexatech/identity-service:0.17.0
    environment:
      <<: *backend-env
      PORT: 3001
      IDENTITY_DATABASE_URL: postgresql://nexatech_identity:changeme@postgres:5432/nexatech_identity
    ports:
      - '3001:3001'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on: *depends-infra
    restart: *backend-restart

  customer-service:
    build:
      context: ../..
      dockerfile: apps/customer-service/Dockerfile
    image: nexatech/customer-service:0.17.0
    environment:
      <<: *backend-env
      PORT: 3002
      CUSTOMER_DATABASE_URL: postgresql://nexatech_customer:changeme@postgres:5432/nexatech_customer
    ports:
      - '3002:3002'
    depends_on: *depends-infra
    restart: *backend-restart

  catalog-service:
    build:
      context: ../..
      dockerfile: apps/catalog-service/Dockerfile
    image: nexatech/catalog-service:0.17.0
    environment:
      <<: *backend-env
      PORT: 3003
      CATALOG_DATABASE_URL: postgresql://nexatech_catalog:changeme@postgres:5432/nexatech_catalog
    ports:
      - '3003:3003'
    depends_on: *depends-infra
    restart: *backend-restart

  media-service:
    build:
      context: ../..
      dockerfile: apps/media-service/Dockerfile
    image: nexatech/media-service:0.17.0
    environment:
      <<: *backend-env
      PORT: 3004
      MEDIA_DATABASE_URL: postgresql://nexatech_media:changeme@postgres:5432/nexatech_media
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: 'false'
      MINIO_REGION: us-east-1
      # Browser-reachable host for SigV4 presign (must match Host the browser uses)
      MINIO_PUBLIC_ENDPOINT: localhost
      MINIO_PUBLIC_PORT: 9000
      MINIO_PUBLIC_USE_SSL: 'false'
    ports:
      - '3004:3004'
    depends_on:
      <<: *depends-infra
      minio:
        condition: service_healthy
    restart: *backend-restart

  inventory-service:
    build:
      context: ../..
      dockerfile: apps/inventory-service/Dockerfile
    image: nexatech/inventory-service:0.17.0
    environment:
      <<: *backend-env
      PORT: 3005
      INVENTORY_DATABASE_URL: postgresql://nexatech_inventory:changeme@postgres:5432/nexatech_inventory
    ports:
      - '3005:3005'
    depends_on: *depends-infra
    restart: *backend-restart

  cart-service:
    build:
      context: ../..
      dockerfile: apps/cart-service/Dockerfile
    image: nexatech/cart-service:0.17.0
    environment:
      <<: *backend-env
      PORT: 3006
      CART_DATABASE_URL: postgresql://nexatech_cart:changeme@postgres:5432/nexatech_cart
      CATALOG_SERVICE_URL: http://catalog-service:3003
      INVENTORY_SERVICE_URL: http://inventory-service:3005
    ports:
      - '3006:3006'
    depends_on: *depends-infra
    restart: *backend-restart

  order-service:
    build:
      context: ../..
      dockerfile: apps/order-service/Dockerfile
    image: nexatech/order-service:0.17.0
    environment:
      <<: *backend-env
      PORT: 3007
      ORDER_DATABASE_URL: postgresql://nexatech_order:changeme@postgres:5432/nexatech_order
      CART_SERVICE_URL: http://cart-service:3006
      INVENTORY_SERVICE_URL: http://inventory-service:3005
      CATALOG_SERVICE_URL: http://catalog-service:3003
    ports:
      - '3007:3007'
    depends_on: *depends-infra
    restart: *backend-restart

  payment-service:
    build:
      context: ../..
      dockerfile: apps/payment-service/Dockerfile
    image: nexatech/payment-service:0.17.0
    environment:
      <<: *backend-env
      PORT: 3008
      PAYMENT_DATABASE_URL: postgresql://nexatech_payment:changeme@postgres:5432/nexatech_payment
      ORDER_SERVICE_URL: http://order-service:3007
      MOCK_PAYMENT_ENABLED: 'true'
    ports:
      - '3008:3008'
    depends_on: *depends-infra
    restart: *backend-restart

  shipping-service:
    build:
      context: ../..
      dockerfile: apps/shipping-service/Dockerfile
    image: nexatech/shipping-service:0.17.0
    environment:
      <<: *backend-env
      PORT: 3009
      SHIPPING_DATABASE_URL: postgresql://nexatech_shipping:changeme@postgres:5432/nexatech_shipping
      MOCK_SHIPPING_ENABLED: 'true'
      ORDER_SERVICE_URL: http://order-service:3007
      INVENTORY_SERVICE_URL: http://inventory-service:3005
    ports:
      - '3009:3009'
    depends_on: *depends-infra
    restart: *backend-restart

  review-service:
    build:
      context: ../..
      dockerfile: apps/review-service/Dockerfile
    image: nexatech/review-service:0.17.0
    environment:
      <<: *backend-env
      PORT: 3010
      REVIEW_DATABASE_URL: postgresql://nexatech_review:changeme@postgres:5432/nexatech_review
      ORDER_SERVICE_URL: http://order-service:3007
      CATALOG_SERVICE_URL: http://catalog-service:3003
      MEDIA_SERVICE_URL: http://media-service:3004
    ports:
      - '3010:3010'
    depends_on: *depends-infra
    restart: *backend-restart

  warranty-service:
    build:
      context: ../..
      dockerfile: apps/warranty-service/Dockerfile
    image: nexatech/warranty-service:0.17.0
    environment:
      <<: *backend-env
      PORT: 3011
      WARRANTY_DATABASE_URL: postgresql://nexatech_warranty:changeme@postgres:5432/nexatech_warranty
      ORDER_SERVICE_URL: http://order-service:3007
      MEDIA_SERVICE_URL: http://media-service:3004
    ports:
      - '3011:3011'
    depends_on: *depends-infra
    restart: *backend-restart

  support-service:
    build:
      context: ../..
      dockerfile: apps/support-service/Dockerfile
    image: nexatech/support-service:0.17.0
    environment:
      <<: *backend-env
      PORT: 3012
      SUPPORT_DATABASE_URL: postgresql://nexatech_support:changeme@postgres:5432/nexatech_support
      ORDER_SERVICE_URL: http://order-service:3007
      MEDIA_SERVICE_URL: http://media-service:3004
    ports:
      - '3012:3012'
    depends_on: *depends-infra
    restart: *backend-restart

  notification-service:
    build:
      context: ../..
      dockerfile: apps/notification-service/Dockerfile
    image: nexatech/notification-service:0.17.0
    environment:
      <<: *backend-env
      PORT: 3013
      NOTIFICATION_DATABASE_URL: postgresql://nexatech_notification:changeme@postgres:5432/nexatech_notification
      # Mailpit in docker-compose.dev.yml — override SMTP_* for production Gmail.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-NexaTech}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@nexatech.local}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
    ports:
      - '3013:3013'
    depends_on: *depends-infra
    restart: *backend-restart

  reporting-service:
    build:
      context: ../..
      dockerfile: apps/reporting-service/Dockerfile
    image: nexatech/reporting-service:0.17.0
    environment:
      <<: *backend-env
      PORT: 3014
      REPORTING_DATABASE_URL: postgresql://nexatech_reporting:changeme@postgres:5432/nexatech_reporting
    ports:
      - '3014:3014'
    depends_on: *depends-infra
    restart: *backend-restart

  storefront-web:
    build:
      context: ../..
      dockerfile: apps/storefront-web/Dockerfile
    image: nexatech/storefront-web:0.17.0
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_BASE_URL: http://localhost:3000
      INTERNAL_API_BASE_URL: http://kong:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      IDENTITY_SERVICE_URL: http://identity-service:3001
      CUSTOMER_SERVICE_URL: http://customer-service:3002
      CATALOG_SERVICE_URL: http://catalog-service:3003
      MEDIA_SERVICE_URL: http://media-service:3004
      INVENTORY_SERVICE_URL: http://inventory-service:3005
      CART_SERVICE_URL: http://cart-service:3006
      ORDER_SERVICE_URL: http://order-service:3007
      PAYMENT_SERVICE_URL: http://payment-service:3008
      SHIPPING_SERVICE_URL: http://shipping-service:3009
      REVIEW_SERVICE_URL: http://review-service:3010
      WARRANTY_SERVICE_URL: http://warranty-service:3011
      SUPPORT_SERVICE_URL: http://support-service:3012
      NOTIFICATION_SERVICE_URL: http://notification-service:3013
      REPORTING_SERVICE_URL: http://reporting-service:3014
      MEDIA_PUBLIC_BASE_URL: http://localhost:9000
    ports:
      - '3000:3000'

  admin-web:
    build:
      context: ../..
      dockerfile: apps/admin-web/Dockerfile
    image: nexatech/admin-web:0.17.0
    environment:
      NODE_ENV: production
      PORT: 3100
      ADMIN_BASE_URL: http://localhost:3100
      INTERNAL_API_BASE_URL: http://kong:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-change-me-admin-session-secret-min-16}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-min-32-chars}
      IDENTITY_SERVICE_URL: http://identity-service:3001
      CUSTOMER_SERVICE_URL: http://customer-service:3002
      CATALOG_SERVICE_URL: http://catalog-service:3003
      MEDIA_SERVICE_URL: http://media-service:3004
      INVENTORY_SERVICE_URL: http://inventory-service:3005
      CART_SERVICE_URL: http://cart-service:3006
      ORDER_SERVICE_URL: http://order-service:3007
      PAYMENT_SERVICE_URL: http://payment-service:3008
      SHIPPING_SERVICE_URL: http://shipping-service:3009
      REVIEW_SERVICE_URL: http://review-service:3010
      WARRANTY_SERVICE_URL: http://warranty-service:3011
      SUPPORT_SERVICE_URL: http://support-service:3012
      NOTIFICATION_SERVICE_URL: http://notification-service:3013
      REPORTING_SERVICE_URL: http://reporting-service:3014
    ports:
      - '3100:3100'

  # Combined Swagger UI — local/lab only. Not present in production Kong/Helm profiles.
  swagger-portal:
    build:
      context: ../..
      dockerfile: apps/swagger-portal/Dockerfile
    image: nexatech/swagger-portal:0.17.0
    environment:
      NODE_ENV: production
      PORT: 8090
      HOST: 0.0.0.0
      OPENAPI_DIR: /app/openapi
      SWAGGER_UI_DIST: /app/node_modules/swagger-ui-dist
      NEXATECH_SWAGGER_PORTAL_ENABLED: '1'
      NEXATECH_DEPLOY_PROFILE: local-lab
    ports:
      - '8090:8090'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Authenticated Security Exploit Guide — local only; credentials from env_file (gitignored).
  security-guide-portal:
    build:
      context: ../..
      dockerfile: apps/security-guide-portal/Dockerfile
    image: nexatech/security-guide-portal:0.17.0
    env_file:
      - path: ../../.env.security-guide.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3200
      HOST: 0.0.0.0
      NEXATECH_ROOT: /app
    ports:
      - '3200:3200'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  default:
    name: nexatech-dev
    external: true
