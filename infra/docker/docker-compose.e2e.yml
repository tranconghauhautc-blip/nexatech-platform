# Isolated E2E stack — does NOT use runtime deployment databases.
# Usage:
#   copy .env.e2e.example .env.e2e
#   pwsh -File scripts/e2e/setup.ps1
#   pwsh -File scripts/e2e/seed.ps1
#   pwsh -File scripts/e2e/run.ps1
#   pwsh -File scripts/e2e/teardown.ps1

name: nexatech-e2e

services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e_password_change_me
      POSTGRES_DB: postgres
    ports:
      - '55432:5432'
    volumes:
      - e2e_pg:/var/lib/postgresql/data
      - ./e2e-init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U e2e']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - '56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - '5673:5672'
      - '15673:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: e2e_minio
      MINIO_ROOT_PASSWORD: e2e_minio_password_change_me
    ports:
      - '59000:9000'
      - '59001:9001'
    volumes:
      - e2e_minio:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - '58025:8025'
      - '51025:1025'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8025/api/v1/info']
      interval: 10s
      timeout: 5s
      retries: 20

  # Application services are started by scripts/e2e/setup.ps1 against this infra
  # via docker-compose.apps.yml overrides or nx serve — keep infra isolated here.

volumes:
  e2e_pg:
  e2e_minio:
