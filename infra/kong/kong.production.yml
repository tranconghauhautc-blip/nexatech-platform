routes:
  - name: storefront-root
    service: storefront-web
    paths: ['/']
    strip_path: false
    preserve_host: true
    regex_priority: 0
  - name: admin-ui
    service: admin-web
    paths: ['/admin']
    strip_path: true
    preserve_host: true
    regex_priority: 10
  - name: identity-auth
    service: identity-service
    paths: ['/api/v1/auth', '/api/v2/auth']
    strip_path: false
    preserve_host: true
  - name: customer
    service: customer-service
    paths: ['/api/v1/customers', '/api/v2/customers']
    strip_path: false
  - name: catalog
    service: catalog-service
    paths:
      [
        '/api/v1/categories',
        '/api/v2/categories',
        '/api/v1/brands',
        '/api/v2/brands',
        '/api/v1/products',
        '/api/v2/products',
        '/api/v1/skus',
        '/api/v2/skus',
        '/api/v1/search',
        '/api/v2/search',
        '/api/v1/spec-templates',
        '/api/v2/spec-templates',
        '/api/v1/admin/catalog',
        '/api/v2/admin/catalog',
      ]
    strip_path: false
  - name: media
    service: media-service
    paths:
      [
        '/api/v1/media',
        '/api/v2/media',
        '/api/v1/admin/media',
        '/api/v2/admin/media',
      ]
    strip_path: false
  - name: inventory
    service: inventory-service
    paths:
      [
        '/api/v1/inventory',
        '/api/v2/inventory',
        '/api/v1/warehouses',
        '/api/v2/warehouses',
        '/api/v1/stores',
        '/api/v2/stores',
        '/api/v1/admin/inventory',
        '/api/v2/admin/inventory',
      ]
    strip_path: false
  - name: cart
    service: cart-service
    paths:
      [
        '/api/v1/cart',
        '/api/v2/cart',
        '/api/v1/wishlist',
        '/api/v2/wishlist',
        '/api/v1/comparisons',
        '/api/v2/comparisons',
        '/api/v1/recently-viewed',
        '/api/v2/recently-viewed',
      ]
    strip_path: false
  - name: order
    service: order-service
    paths:
      [
        '/api/v1/orders',
        '/api/v2/orders',
        '/api/v1/checkout',
        '/api/v2/checkout',
        '/api/v1/admin/orders',
        '/api/v2/admin/orders',
      ]
    strip_path: false
  - name: payment
    service: payment-service
    paths:
      [
        '/api/v1/payments',
        '/api/v2/payments',
        '/api/v1/admin/payments',
        '/api/v2/admin/payments',
      ]
    strip_path: false
  - name: shipping
    service: shipping-service
    paths:
      [
        '/api/v1/shipping',
        '/api/v2/shipping',
        '/api/v1/admin/shipping',
        '/api/v2/admin/shipping',
      ]
    strip_path: false
  - name: review
    service: review-service
    paths:
      [
        '/api/v1/reviews',
        '/api/v2/reviews',
        '/api/v1/admin/reviews',
        '/api/v2/admin/reviews',
      ]
    strip_path: false
  - name: warranty
    service: warranty-service
    paths:
      [
        '/api/v1/warranty',
        '/api/v2/warranty',
        '/api/v1/returns',
        '/api/v2/returns',
        '/api/v1/admin/warranty',
        '/api/v2/admin/warranty',
      ]
    strip_path: false
  - name: support
    service: support-service
    paths:
      [
        '/api/v1/support',
        '/api/v2/support',
        '/api/v1/admin/support',
        '/api/v2/admin/support',
      ]
    strip_path: false
  - name: notification
    service: notification-service
    paths:
      [
        '/api/v1/notifications',
        '/api/v2/notifications',
        '/api/v1/admin/notifications',
        '/api/v2/admin/notifications',
      ]
    strip_path: false
  - name: reporting
    service: reporting-service
    paths: ['/api/v1/admin/reporting', '/api/v2/admin/reporting']
    strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - '*'
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - x-request-id
        - x-trace-id
        - x-user-id
        - x-user-roles
        - x-cart-token
      credentials: true
      max_age: 3600
  - name: correlation-id
    config:
      header_name: x-request-id
      generator: uuid
      echo_downstream: true
  # rate-limiting: enable when production thresholds are known
  # - name: rate-limiting
  #   config:
  #     minute: 120
  #     policy: local
