# Generated by pnpm openapi:generate — no secrets.
# service: identity-service
# source: live
components:
  schemas:
    AuthTokenResponseDto:
      properties:
        accessToken:
          description: JWT access token — dán vào Swagger Authorize (Bearer)
          type: string
        expiresIn:
          example: 900
          type: number
        refreshToken:
          description: Refresh token — chỉ dùng cho /auth/refresh; không commit
          type: string
        tokenType:
          example: Bearer
          type: string
        userId:
          example: "00000000-0000-4000-8000-000000000001"
          type: string
      required:
        - userId
        - accessToken
        - refreshToken
        - expiresIn
        - tokenType
      type: object
    ErrorEnvelope:
      type: object
      required:
        - errorCode
        - message
        - details
        - traceId
        - timestamp
      properties:
        errorCode:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        traceId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
    ErrorEnvelopeDto:
      properties:
        details:
          additionalProperties: true
          type: object
        errorCode:
          example: UNAUTHORIZED
          type: string
        message:
          type: string
        timestamp:
          format: date-time
          type: string
        traceId:
          format: uuid
          type: string
      required:
        - errorCode
        - message
        - details
        - traceId
        - timestamp
      type: object
    ForgotPasswordRequestDto:
      properties:
        email:
          example: "user@example.com"
          type: string
      required:
        - email
      type: object
    LoginRequestDto:
      properties:
        email:
          description: "Email đăng nhập (local seed dùng @nexatech.local)"
          example: "staff@nexatech.local"
          type: string
        password:
          description: Không commit mật khẩu thật vào OpenAPI/repo
          example: "<operator-defined-DEV_SEED_PASSWORD>"
          type: string
      required:
        - email
        - password
      type: object
    LogoutRequestDto:
      properties:
        sessionId:
          description: Session id gắn với refresh token
          type: string
      required:
        - sessionId
      type: object
    MeResponseDto:
      properties:
        email:
          type: string
        fullName:
          type: string
        roles:
          example:
            - Staff
          items:
            type: string
          type: array
        sessionId:
          type: string
        status:
          type: string
        userId:
          type: string
      required:
        - userId
        - email
        - roles
      type: object
    PaginationMeta:
      type: object
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    RefreshRequestDto:
      properties:
        refreshToken:
          description: Refresh token từ login — không log ra console lab công khai
          type: string
      required:
        - refreshToken
      type: object
    RegisterRequestDto:
      properties:
        email:
          example: "customer@example.com"
          type: string
        fullName:
          example: Nguyen Van A
          type: string
        password:
          example: "StrongPass1!"
          minLength: 8
          type: string
      required:
        - email
        - password
        - fullName
      type: object
    ResetPasswordRequestDto:
      properties:
        code:
          example: 123456
          type: string
        email:
          example: "user@example.com"
          type: string
        newPassword:
          example: "NewStrongPass1!"
          type: string
      required:
        - email
        - code
        - newPassword
      type: object
    VerifyEmailRequestDto:
      properties:
        code:
          example: 123456
          type: string
        email:
          example: "customer@example.com"
          type: string
      required:
        - email
        - code
      type: object
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from identity POST /api/v1/auth/login. Never commit real tokens.
    idempotencyKey:
      type: apiKey
      in: header
      name: Idempotency-Key
    requestId:
      type: apiKey
      in: header
      name: x-request-id
    traceId:
      type: apiKey
      in: header
      name: x-trace-id
    userId:
      type: apiKey
      in: header
      name: x-user-id
    userRoles:
      type: apiKey
      in: header
      name: x-user-roles
